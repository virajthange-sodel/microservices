networks:
  microservices-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:
  # =====================================================================
  # 1. INFRASTRUCTURE LAYER (Databases, Broker, Cache)
  # =====================================================================

  # Single MySQL instance serving all 3 microservice databases
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Automatically runs on first startup to create user_db, product_db, order_db
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for order count caching
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices-net

  # Apache Kafka in KRaft mode (No Zookeeper required)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - microservices-net

  # =====================================================================
  # 2. SPRING CLOUD PLATFORM (Registry, Config Server, Gateway)
  # =====================================================================

  # Eureka Service Registry
  eureka-server:
    build: ./serivice_registry
    container_name: eureka-server
    restart: on-failure
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net

  # Spring Cloud Config Server
  config-server:
    build: ./config_server
    container_name: config-server
    restart: on-failure
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8090/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8088/CONFIG-SERVER/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - microservices-net

  # Spring Cloud API Gateway
  api-gateway:
    build: ./api_gateway
    container_name: api-gateway
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8090/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net

  # =====================================================================
  # 3. CORE BUSINESS SERVICES
  # =====================================================================

  # User Service (MySQL user_db + Quartz)
  user-service:
    build: ./user_service
    container_name: user-service
    restart: on-failure
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8090/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net

  # Product Service (Config Server + MySQL product_db)
  product-service:
    build: ./product_service
    container_name: product-service
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: PRODUCT-SERVICE
      CONFIG_SERVER_URL: http://config-server:8088
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8088
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8090/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net

  # Order Service (Config Server + MySQL order_db + Kafka Producer)
  order-service:
    build: ./order_service
    container_name: order-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: ORDER-SERVICE
      CONFIG_SERVER_URL: http://config-server:8088
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8088
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8090/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net

  # Order Counter Service (Kafka Consumer + Redis)
  order-counter-service:
    build: ./order-counter-service
    container_name: order-counter-service
    restart: on-failure
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8090/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net